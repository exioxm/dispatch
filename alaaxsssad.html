<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LASD: Dispatch Final</title>
    <style>
        :root { --lasd-tan: #D2B48C; --lasd-gold: #FFD700; --lasd-green: #1b4d3e; }
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: #222; color: white; user-select: none; }
        
        #game-container { display: flex; height: 100vh; width: 100vw; }
        #canvas-area { position: relative; flex-grow: 1; overflow: hidden; background: #333; }
        canvas { display: block; transform-origin: 0 0; } 
        
        /* Main Menu Styling */
        #main-menu { position: absolute; width: 100%; height: 100%; background-color: var(--lasd-tan); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        #menu-title { font-size: 80px; color: var(--lasd-gold); -webkit-text-stroke: 3px black; text-shadow: 4px 4px 0px #000; margin-bottom: 40px; text-transform: uppercase; }
        #play-btn { padding: 20px 60px; font-size: 30px; background-color: var(--lasd-gold); color: black; border: 5px solid black; cursor: pointer; font-weight: bold; }

        /* Fixed UI Panels on Top of Game */
        .ui-panel { position: absolute; background: rgba(0,0,0,0.85); padding: 15px; border: 2px solid var(--lasd-gold); border-radius: 5px; color: white; display: none; }
        #ui-hud { top: 10px; left: 10px; z-index: 5; }
        #ui-log { bottom: 10px; left: 10px; width: 300px; height: 120px; overflow-y: auto; font-size: 12px; z-index: 5; }
        #ui-shop { top: 0; right: 0; width: 240px; height: 100vh; background: #2d3436; border-left: 3px solid var(--lasd-gold); padding: 15px; box-sizing: border-box; z-index: 10; display: none; }
        #ui-fleet { bottom: 0; left: 0; right: 240px; height: 120px; background: #111; border-top: 3px solid var(--lasd-gold); display: none; padding: 10px; overflow-x: auto; box-sizing: border-box; z-index: 5; }
        
        .shop-btn { width: 100%; padding: 12px; margin: 10px 0; background: var(--lasd-gold); border: 2px solid black; font-weight: bold; cursor: pointer; }
        .unit-card { min-width: 140px; background: #333; border: 1px solid #555; margin-right: 10px; padding: 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .unit-card.selected { border: 2px solid white !important; background: #555; }
        .status-idle { border-left: 5px solid #2ecc71; }
        .status-busy { border-left: 5px solid #e74c3c; }
        
        #dispatch-menu { position: absolute; display: none; background: rgba(0,0,0,0.95); border: 2px solid var(--lasd-gold); padding: 10px; z-index: 100; border-radius: 5px; }
        .dispatch-btn { display: block; width: 100%; margin: 5px 0; padding: 8px; background: #444; color: white; border: 1px solid var(--lasd-gold); cursor: pointer; }
        .stat { color: var(--lasd-gold); font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Menu Overlay -->
    <div id="main-menu">
        <h1 id="menu-title">LASD: Dispatch</h1>
        <button id="play-btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <div id="canvas-area">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-hud" class="ui-panel">
            <h2 style="color: var(--lasd-gold); margin-top:0;">LASD DISPATCH</h2>
            <p>Budget: $<span id="funds" class="stat">5000</span></p>
            <p>Active Calls: <span id="crimeCount" class="stat">0</span></p>
        </div>

        <div id="ui-log" class="ui-panel"></div>

        <div id="dispatch-menu">
            <div style="font-size:12px; margin-bottom:5px; color:var(--lasd-gold)">DISPATCH UNIT:</div>
            <button class="dispatch-btn" onclick="assignNearest()">Nearest Unit</button>
            <button class="dispatch-btn" onclick="assignAll()">Send All Units</button>
            <button class="dispatch-btn" onclick="closeDispatch()" style="background:red">Cancel</button>
        </div>
    </div>

    <div id="ui-shop">
        <h2 style="color: var(--lasd-gold); margin-top:0;">VEHICLE SHOP</h2>
        <p>AVAILABLE VEHICLES:</p>
        <button class="shop-btn" onclick="buyVehicle('Crown Vic', 1200)">Crown Victoria ($1200)</button>
        <button class="shop-btn" onclick="buyVehicle('Explorer', 2500)">Ford Explorer ($2500)</button>
        <div id="log" style="font-size:11px; margin-top:20px; height:150px; overflow-y:auto; color:#ccc;"></div>
    </div>
</div>

<div id="ui-fleet"></div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('dispatch-menu');
const uiFleet = document.getElementById('ui-fleet');
const canvasArea = document.getElementById('canvas-area');

let gameRunning = false;
let funds = 5000;
let units = [];
let crimes = [];
let buildings = [];
let selectedCrime = null;
let selectedUnit = null;
const GRID_CELL = 20;
const ROAD_WIDTH = 60;
const MAP_WIDTH = 2000;
const MAP_HEIGHT = 1200;

// Camera variables
let cameraX = 0; let cameraY = 0; let zoom = 1.0; const MIN_ZOOM = 0.5; const MAX_ZOOM = 2.0;
let isDragging = false; let dragStartX, dragStartY; let canvasAreaRect;

function startGame() {
    gameRunning = true;
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('ui-hud').style.display = 'block';
    document.getElementById('ui-log').style.display = 'block';
    document.getElementById('ui-shop').style.display = 'block';
    document.getElementById('ui-fleet').style.display = 'flex';
    resize();
    initMap();
    addUnit('Crown Vic', 80, 80); addUnit('Crown Vic', 80, 80); addUnit('Explorer', 80, 80);
    gameLoop();
}

function resize() {
    canvasAreaRect = document.getElementById('canvas-area').getBoundingClientRect();
    canvas.width = MAP_WIDTH; canvas.height = MAP_HEIGHT;
    updateCameraTransform();
    document.getElementById('funds').innerText = funds;
}
function updateCameraTransform() {
    const effectiveWidth = MAP_WIDTH * zoom; const effectiveHeight = MAP_HEIGHT * zoom;
    cameraX = Math.max(0, Math.min(cameraX, effectiveWidth - canvasAreaRect.width));
    cameraY = Math.max(0, Math.min(cameraY, effectiveHeight - canvasAreaRect.height));
    canvas.style.transform = `translate(${-cameraX}px, ${-cameraY}px) scale(${zoom})`;
}


const BUILDING_SPECS = {
    STATION:    { color: '#1b4d3e', minW: 4, maxW: 4, minH: 4, maxH: 4 },
    PARK:       { color: '#2ecc71', minW: 6, maxW: 10, minH: 4, maxH: 8 },
    BANK:       { color: '#f1c40f', minW: 3, maxW: 5, minH: 3, maxH: 5 },
    MARKET:     { color: '#9b59b6', minW: 4, maxW: 6, minH: 4, maxH: 6 },
    APARTMENTS: { color: '#555555', minW: 3, maxW: 8, minH: 3, maxH: 6 }
};

function initMap() {
    buildings = [];
    buildings.push({ x: 40, y: 40, w: 80, h: 80, type: 'STATION', color: '#1b4d3e' });
    function placeBuilding(type, count = 1) {
        const spec = BUILDING_SPECS[type];
        for (let i = 0; i < count; i++) {
            let placed = false;
            for (let attempts = 0; attempts < 50; attempts++) {
                const w = (Math.floor(Math.random() * (spec.maxW - spec.minW + 1)) + spec.minW) * GRID_CELL;
                const h = (Math.floor(Math.random() * (spec.maxH - spec.minH + 1)) + spec.minH) * GRID_CELL;
                const x = 150 + Math.random() * (MAP_WIDTH - 300 - w);
                const y = 150 + Math.random() * (MAP_HEIGHT - 300 - h);
                const newB = { x, y, w, h, type, color: spec.color };
                let overlap = false;
                for (let existingB of buildings) {
                    if (newB.x < existingB.x + existingB.w + 10 && newB.x + newB.w + 10 > existingB.x &&
                        newB.y < existingB.y + existingB.h + 10 && newB.y + newB.h + 10 > existingB.y) { overlap = true; break; }
                }
                if (!overlap) { buildings.push(newB); placed = true; break; }
            }
        }
    }
    placeBuilding('PARK', 2); placeBuilding('MARKET', 2); placeBuilding('BANK', 1); placeBuilding('APARTMENTS', 30);
}

function addUnit(type, x, y) {
    const id = (type === 'Explorer' ? '240-E' : '240-V') + (units.length + 1);
    units.push({ id, type, x, y, status: 'IDLE', target: null, speed: type === 'Explorer' ? 3.5 : 3 });
    updateFleetUI();
}
function buyVehicle(type, cost) {
    if (funds >= cost) { funds -= cost; document.getElementById('funds').innerText = funds; addUnit(type, 80, 80); addLog(`Purchased ${type}: ${units[units.length-1].id}`); } else { addLog("Not enough funds!"); }
}
function checkCollision(newX, newY, size) {
    for (let b of buildings) {
        if (newX < b.x + b.w + 2 && newX + size + 2 > b.x && newY < b.y + b.h + 2 && newY + size + 2 > b.y) { return true; }
    }
    return false;
}

function update() {
    if (!gameRunning) return;
    units.forEach(u => {
        if (u.target) {
            const dx = u.target.x - u.x; const dy = u.target.y - u.y; const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 10) {
                let vx = (dx / dist) * u.speed; let vy = (dy / dist) * u.speed;
                if (!checkCollision(u.x + vx, u.y, 14)) u.x += vx;
                if (!checkCollision(u.x, u.y + vy, 14)) u.y += vy;
            } else {
                u.status = 'ON SCENE';
                setTimeout(() => { crimes = crimes.filter(c => c !== u.target); u.target = null; u.status = 'IDLE'; updateFleetUI(); }, 5000);
            }
        }
    });

    if (Math.random() < 0.002) spawnCrime(); 
    document.getElementById('crimeCount').innerText = crimes.length;
}

function draw() {
    if (!gameRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#444';
    for(let i=0; i<canvas.width; i+=GRID_CELL*5) { ctx.fillRect(i - ROAD_WIDTH/2, 0, ROAD_WIDTH, canvas.height); }
    for(let i=0; i<canvas.height; i+=GRID_CELL*5) { ctx.fillRect(0, i - ROAD_WIDTH/2, canvas.width, ROAD_WIDTH); }
    

    buildings.forEach(b => {
        ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeStyle = "black"; ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "white"; ctx.font = "10px Arial"; ctx.fillText(b.type, b.x + 5, b.y + 15);
    });

    crimes.forEach(c => {
        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(c.x, c.y, 10, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = "white"; ctx.stroke();
    });

    units.forEach(u => {
        ctx.fillStyle = u.type === 'Explorer' ? '#fff' : 'var(--lasd-gold)';
        ctx.fillRect(u.x-7, u.y-7, 14, 14); ctx.strokeRect(u.x-7, u.y-7, 14, 14);
        if (selectedUnit === u) {
            ctx.strokeStyle = "cyan";
            ctx.lineWidth = 3;
            ctx.strokeRect(u.x-9, u.y-9, 18, 18);
        }
    });

    update();
}

function spawnCrime() {
    for (let attempts = 0; attempts < 50; attempts++) {
        const x = 150 + Math.random() * (MAP_WIDTH - 300);
        const y = 150 + Math.random() * (MAP_HEIGHT - 300);
        if (!checkCollision(x, y, 20)) { crimes.push({ x, y }); addLog(`Crime spawned at ${Math.floor(x)}, ${Math.floor(y)}`); return; }
    }
}

// 5. MOUSE INTERACTION & CAMERA LOGIC
canvasArea.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        const mx = (e.clientX - canvasAreaRect.left) / zoom + cameraX / zoom;
        const my = (e.clientY - canvasAreaRect.top) / zoom + cameraY / zoom;

        selectedCrime = crimes.find(c => Math.sqrt((mx-c.x)**2 + (my-c.y)**2) < 20);
        if (selectedCrime) {
            menu.style.display = 'block';
            menu.style.left = (e.clientX - canvasAreaRect.left) + 'px';
            menu.style.top = (e.clientY - canvasAreaRect.top) + 'px';
        } else if (selectedUnit) {
            selectedUnit.target = { x: mx, y: my };
            selectedUnit.status = 'EN ROUTE (Relocated)';
            addLog(`${selectedUnit.id} moved to new location.`);
            deselectUnit();
        } else {
            closeDispatch();
        }
    } else if (e.button === 2) {
        isDragging = true;
        dragStartX = e.clientX + cameraX;
        dragStartY = e.clientY + cameraY;
        canvasArea.style.cursor = 'grabbing';
        deselectUnit();
    }
});
window.addEventListener('mousemove', (e) => {
    if (isDragging) { cameraX = dragStartX - e.clientX; cameraY = dragStartY - e.clientY; updateCameraTransform(); }
});
window.addEventListener('mouseup', (e) => {
    if (e.button === 2) { isDragging = false; canvasArea.style.cursor = 'crosshair'; }
});
canvasArea.addEventListener('contextmenu', (e) => e.preventDefault());

// FIX: New Keyboard Zoom Handling
window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    const oldZoom = zoom;
    if (e.key === 'z') { // Zoom In
        zoom = Math.min(MAX_ZOOM, zoom + 0.1);
    } else if (e.key === 'x') { // Zoom Out
        zoom = Math.max(MIN_ZOOM, zoom - 0.1);
    }
    
    if (oldZoom !== zoom) {
        // Simple zoom center logic for keyboard input (zoom to center of viewport)
        const mouseX = canvasAreaRect.width / 2;
        const mouseY = canvasAreaRect.height / 2;
        cameraX += (mouseX / oldZoom) * (oldZoom - zoom);
        cameraY += (mouseY / oldZoom) * (oldZoom - zoom);
        updateCameraTransform();
    }
});


function selectUnit(unitId) {
    selectedUnit = units.find(u => u.id === unitId);
    updateFleetUI();
    addLog(`Unit ${unitId} selected. Click on map to relocate.`);
}
function deselectUnit() { selectedUnit = null; updateFleetUI(); }
function assignNearest() {
    const idle = units.filter(u => u.status === 'IDLE');
    if (idle.length > 0) {
        let nearest = idle.reduce((prev, curr) => {
            const d1 = Math.sqrt((selectedCrime.x-prev.x)**2 + (selectedCrime.y-prev.y)**2);
            const d2 = Math.sqrt((selectedCrime.x-curr.x)**2 + (selectedCrime.y-curr.y)**2);
            return d1 < d2 ? prev : curr;
        });
        nearest.target = selectedCrime; nearest.status = 'RESPONDING'; addLog(`${nearest.id} responding to call.`);
    }
    closeDispatch();
}
function assignAll() { units.filter(u => u.status === 'IDLE').forEach(u => { u.target = selectedCrime; u.status = 'RESPONDING'; }); addLog(`All available units dispatched.`); closeDispatch(); }
function closeDispatch() { menu.style.display = 'none'; updateFleetUI(); }
function updateFleetUI() {
    uiFleet.innerHTML = '';
    units.forEach(u => {
        const div = document.createElement('div');
        div.className = `unit-card ${u.status === 'IDLE' ? 'status-idle' : 'status-busy'} ${selectedUnit === u ? 'selected' : ''}`;
        div.innerHTML = `<b>${u.id}</b><br>${u.type}<br><i>${u.status}</i>`;
        div.onclick = () => selectUnit(u.id);
        uiFleet.appendChild(div);
    });
}
function addLog(t) { const l = document.getElementById('log'); l.innerHTML = `> ${t}<br>` + l.innerHTML; }


window.onresize = resize;
</script>
</body>
</html>
