<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LASD Dispatcher Simulator</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #c5a059; border-radius: 5px; }
        canvas { background: #333; display: block; }
        .lasd-gold { color: #c5a059; font-weight: bold; }
        #log { position: absolute; bottom: 10px; left: 10px; width: 300px; height: 100px; background: rgba(0,0,0,0.8); overflow-y: auto; padding: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 class="lasd-gold">LASD DISPATCH</h2>
        <p>Units Available: <span id="unitCount">3</span></p>
        <p>Active Crimes: <span id="crimeCount">0</span></p>
        <small>Click a <span style="color:red">RED</span> crime to send a unit.</small>
    </div>
    <div id="log"></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const log = document.getElementById('log');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- CONFIGURATION ---
const GRID_SIZE = 100; // Distance between intersections
const BUILDING_SIZE = 60; // Size of non-walkable buildings
const UNIT_SPEED = 2;

// LASD Colors: Green and Gold
const COLORS = { building: '#2d3436', road: '#444', station: '#1b4d3e', unit: '#c5a059', crime: '#ff4757' };

let buildings = [];
let crimes = [];
let units = [
    { x: 100, y: 100, target: null, status: 'IDLE', id: '240-Adam' },
    { x: 100, y: 100, target: null, status: 'IDLE', id: '240-Boy' },
    { x: 100, y: 100, target: null, status: 'IDLE', id: '240-Charlie' }
];

// --- INITIALIZATION ---
function initMap() {
    for (let x = GRID_SIZE/2; x < canvas.width; x += GRID_SIZE) {
        for (let y = GRID_SIZE/2; y < canvas.height; y += GRID_SIZE) {
            // Place buildings in the center of "blocks"
            buildings.push({ 
                x: x + 20, 
                y: y + 20, 
                w: BUILDING_SIZE, 
                h: BUILDING_SIZE 
            });
        }
    }
}

// --- GAME LOGIC ---
function spawnCrime() {
    if (Math.random() < 0.01) { // 1% chance per frame to spawn
        const rx = Math.floor(Math.random() * (canvas.width/GRID_SIZE)) * GRID_SIZE + 50;
        const ry = Math.floor(Math.random() * (canvas.height/GRID_SIZE)) * GRID_SIZE + 50;
        crimes.push({ x: rx, y: ry, active: true });
        addLog("911 CALL: Crime reported at " + rx + ", " + ry);
    }
}

function update() {
    units.forEach(unit => {
        if (unit.target) {
            const dx = unit.target.x - unit.x;
            const dy = unit.target.y - unit.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 5) {
                // Simple movement (in a real game, use A* pathfinding to avoid buildings)
                unit.x += (dx / dist) * UNIT_SPEED;
                unit.y += (dy / dist) * UNIT_SPEED;
            } else {
                // Arrived at crime
                unit.status = 'ON SCENE';
                setTimeout(() => {
                    crimes = crimes.filter(c => c !== unit.target);
                    unit.target = null;
                    unit.status = 'IDLE';
                    addLog(unit.id + " cleared the scene.");
                }, 3000);
            }
        }
    });
    spawnCrime();
    document.getElementById('crimeCount').innerText = crimes.length;
}

// --- DRAWING ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Roads (Grid)
    ctx.strokeStyle = COLORS.road;
    for(let i=0; i<canvas.width; i+=GRID_SIZE) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    for(let i=0; i<canvas.height; i+=GRID_SIZE) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

    // Draw Buildings (Collidable Zones)
    ctx.fillStyle = COLORS.building;
    buildings.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // Draw Station
    ctx.fillStyle = COLORS.station;
    ctx.fillRect(80, 80, 40, 40);
    ctx.fillStyle = 'white';
    ctx.fillText("LASD STATION", 70, 75);

    // Draw Crimes
    ctx.fillStyle = COLORS.crime;
    crimes.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 10, 0, Math.PI*2);
        ctx.fill();
    });

    // Draw Units
    units.forEach(u => {
        ctx.fillStyle = COLORS.unit;
        ctx.fillRect(u.x - 5, u.y - 5, 10, 10);
        ctx.font = "10px Arial";
        ctx.fillText(u.id, u.x - 15, u.y - 10);
    });

    update();
    requestAnimationFrame(draw);
}

// --- INPUTS ---
canvas.addEventListener('click', (e) => {
    crimes.forEach(crime => {
        const dist = Math.sqrt((e.clientX - crime.x)**2 + (e.clientY - crime.y)**2);
        if (dist < 20) {
            const idleUnit = units.find(u => u.status === 'IDLE');
            if (idleUnit) {
                idleUnit.target = crime;
                idleUnit.status = 'RESPONDING';
                addLog(idleUnit.id + " responding to call.");
            }
        }
    });
});

function addLog(msg) {
    const p = document.createElement('p');
    p.innerText = "> " + msg;
    log.prepend(p);
}

initMap();
draw();
</script>
</body>
</html>
